# Why: Pinned cosign and Syft installation shared by release and contract workflows.
name: Install release tools
description: Install pinned cosign and Syft binaries for signing and SBOM generation.
runs:
  using: composite
  steps:
    - name: Install pinned cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: v3.1.4

    - name: Install pinned Syft
      uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        syft-version: v1.54.1

    - name: Verify the installed versions match the pins
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/verify-versions.sh"
