# Semgrep runs fully inside its pinned container on a GitHub-hosted runner.
# Rulesets come from the public registry without an account; `--config auto`
# is deliberately NOT used because it reports the project URL.
name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep analysis
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # SARIF upload: every PR gets a code-scanning check run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Semgrep
        shell: bash
        run: |
          set -euo pipefail
          # The tree is streamed in over stdin and the SARIF copy comes back on
          # stdout (text findings go to stderr), so the scan does not depend on
          # the daemon sharing a filesystem with the job. mirror.gcr.io is a
          # pull-through mirror of Docker Hub that serves the same digest;
          # hosted runners hit the anonymous Docker Hub pull limit.
          tar -cf - --exclude=.git . \
            | docker run --rm -i mirror.gcr.io/semgrep/semgrep:1.144.0@sha256:10301f060aacf84078f9704fb1ba3a321df4ac46b009fd29c1c66880d1db8e77 \
                sh -ec 'mkdir -p /src && tar -xf - -C /src && cd /src && \
                  { semgrep --test --metrics=off tools/semgrep/ 1>&2 || exit 3; } && rc=0 && \
                  semgrep scan \
                    --config p/golang \
                    --config p/security-audit \
                    --config tools/semgrep/ \
                    --exclude tools/semgrep \
                    --sarif-output=/tmp/semgrep.sarif \
                    --error --metrics=off --quiet . 1>&2 || rc=$?; \
                  cat /tmp/semgrep.sarif; [ "$rc" -le 1 ] || exit "$rc"' > semgrep.sarif

      - name: Drop suppressed and excepted results
        if: always() && hashFiles('semgrep.sarif') != ''
        shell: bash
        run: |
          set -euo pipefail
          # Semgrep rc 1 (findings) is judged here: nosemgrep and dated per-file exceptions drop out, the rest fails.
          bash tools/semgrep-filter_test.sh
          bash tools/semgrep-filter.sh semgrep.sarif
      - name: Upload SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Checkout repository source tree
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Download, verify, and unpack pinned Trivy release
      - name: Install Trivy
        shell: bash
        run: |
          set -euo pipefail
          TRIVY_VERSION="0.76.1"
          TRIVY_SHA256="c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0"
          curl -sSfL --max-time 60 https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz -o "$RUNNER_TEMP/trivy.tar.gz"
          echo "$TRIVY_SHA256  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/trivy-bin"
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"
          rm "$RUNNER_TEMP/trivy.tar.gz"

      # Verify Trivy detection on a planted vulnerable module
      - name: Verify Trivy detection (planted case)
        shell: bash
        run: |
          set -euo pipefail
          plant="$RUNNER_TEMP/trivy-planted"
          mkdir -p "$plant"
          printf 'module example.com/trivy-planted\n\ngo 1.21\n\nrequire golang.org/x/net v0.16.0\n' > "$plant/go.mod"
          output=$(trivy fs --scanners vuln --severity HIGH,CRITICAL "$plant")
          echo "$output"
          if ! echo "$output" | grep -q "CVE-2023-39325"; then
            echo "::error::Planted vulnerability CVE-2023-39325 not detected by Trivy"
            exit 1
          fi
          rm -rf "$plant"

      # Run filesystem scan for vulnerabilities and secrets
      - name: Scan repository (vuln, secret)
        shell: bash
        run: |
          set -euo pipefail
          trivy fs --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 .
