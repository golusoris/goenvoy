# Static analysis that can actually run on this Gitea instance.
#
# Replaces CodeQL, which fails at "Initialize CodeQL" every time: the action
# needs GitHub's CodeQL infrastructure and uploads to the security-events API,
# neither of which exists here. That failure kept every PR red and burned the
# shared runner that also builds the cluster's images.
#
# Semgrep runs fully inside its own container, so no toolchain is required on
# the runner. Rulesets come from the public registry without an account;
# `--config auto` is deliberately NOT used because it reports the project URL.
name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        shell: bash
        run: |
          set -euo pipefail
          # The runner image ships no Python/Semgrep; the daemon is the dind
          # sidecar reached over DOCKER_HOST. Resolve its address at runtime —
          # act puts each job on its own network, so the bridge gateway is not
          # a stable address, and iproute2 is not guaranteed in the image.
          gw=$(ip route 2>/dev/null | awk '/^default/{print $3; exit}' || true)
          if [ -z "$gw" ]; then
            h=$(awk '$2=="00000000"{print $3; exit}' /proc/net/route)
            [ -n "$h" ] && gw=$(printf '%d.%d.%d.%d' "0x${h:6:2}" "0x${h:4:2}" "0x${h:2:2}" "0x${h:0:2}")
          fi
          [ -n "$gw" ] || { echo "could not resolve the dind gateway" >&2; exit 1; }
          export DOCKER_HOST="tcp://${gw}:2375"

          # The dind daemon cannot bind-mount this workspace: they are separate
          # containers with separate filesystems. Stream the tree in over stdin
          # rather than reaching for a -v that would mount an empty directory.
          tar -cf - --exclude=.git . \
            | docker run --rm -i -w /src semgrep/semgrep:1.144.0 \
                sh -ec 'mkdir -p /src && tar -xf - -C /src && \
                  semgrep scan \
                    --config p/golang \
                    --config p/security-audit \
                    --error --metrics=off --quiet /src'
