# Semgrep runs fully inside its pinned container on a GitHub-hosted runner.
# Rulesets come from the public registry without an account; `--config auto`
# is deliberately NOT used because it reports the project URL.
name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep analysis
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Semgrep
        shell: bash
        run: |
          set -euo pipefail
          # The tree is streamed in over stdin, so the scan does not depend on
          # the daemon sharing a filesystem with the job. mirror.gcr.io is a
          # pull-through mirror of Docker Hub that serves the same digest;
          # hosted runners hit the anonymous Docker Hub pull limit.
          tar -cf - --exclude=.git . \
            | docker run --rm -i mirror.gcr.io/semgrep/semgrep:1.144.0@sha256:10301f060aacf84078f9704fb1ba3a321df4ac46b009fd29c1c66880d1db8e77 \
                sh -ec 'mkdir -p /src && tar -xf - -C /src && \
                  semgrep scan \
                    --config p/golang \
                    --config p/security-audit \
                    --error --metrics=off --quiet /src'
