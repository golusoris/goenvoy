name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - scripts/ci/mkdocs-build.sh
      - scripts/ci/docker-hub-mirror.sh
      - scripts/ci/mkdocs-build-policy_test.sh
      - scripts/ci/docker-hub-mirror_test.sh
      - .github/actions/docker-hub-mirror/**
      - tools/tool-versions.env
      - .github/workflows/docs.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - docs/**
      - mkdocs.yml
      - scripts/ci/mkdocs-build.sh
      - scripts/ci/docker-hub-mirror.sh
      - scripts/ci/mkdocs-build-policy_test.sh
      - scripts/ci/docker-hub-mirror_test.sh
      - .github/actions/docker-hub-mirror/**
      - tools/tool-versions.env
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

# Allow one concurrent deployment; don't cancel an in-progress one so a
# published site is never left half-deployed.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('docs-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  build:
    name: Build mkdocs site
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Why: the mirror test starts no container engine, so it runs before the runner's Docker daemon is touched.
      - name: Mirror script refuses its planted cases
        run: bash scripts/ci/docker-hub-mirror_test.sh
      - name: Pull Docker Hub images through mirror.gcr.io
        uses: ./.github/actions/docker-hub-mirror
      # Why: the last cases of this test build real fixture sites, so its image pulls must go through the mirror.
      - name: Site build script refuses its planted cases
        run: bash scripts/ci/mkdocs-build-policy_test.sh

      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Build site from immutable tooling
        run: bash scripts/ci/mkdocs-build.sh --site-dir site

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      # nosemgrep: codacy.yaml.security.hard-coded-tokens -- OIDC permission name required by deploy-pages, no token value.
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
