name: Release runner tool contract

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools:
    name: Verify rootless release tools
    runs-on: arc-cauda-golusoris-goenvoy
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.27.0'
          cache: false

      - name: Install pinned cosign rootlessly
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.3

      - name: Install pinned syft rootlessly
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.51.1

      - name: Verify the release runtime contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUNNER_TEMP"
          test -w "$RUNNER_TEMP"
          test -w "$RUNNER_TOOL_CACHE"
          for tool in bash git curl tar gzip sha256sum gh go node cosign syft; do
            command -v "$tool"
          done
          gh --version
          go version
          node --version
          cosign version | grep -q 'GitVersion:.*v2.6.3'
          syft version | grep -q 'Version:.*1.51.1'
