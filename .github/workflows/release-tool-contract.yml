# Dispatch-only proof that the pinned tool installs of release.yml work on the
# hosted runner, without cutting a release: same versions through the same
# SHA-pinned actions, a version check, a local cosign sign/verify round trip
# and the SBOM command.
name: Release runner tool contract

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools:
    name: Verify pinned release tools
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Install pinned Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1

      - name: Verify the release runtime contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUNNER_TEMP"
          test -w "$RUNNER_TEMP"
          test -w "$RUNNER_TOOL_CACHE"
          for tool in bash git curl tar gzip sha256sum gh jq go node cosign syft; do
            command -v "$tool"
          done
          gh --version
          go version
          node --version
          cosign version | grep -Eq '^GitVersion:[[:space:]]+v?3\.1\.3(\+dirty)?[[:space:]]*$'
          syft version | grep -Eq 'Version:[[:space:]]+1\.54\.1([[:space:]]|$)'
          roundtrip_dir="$(mktemp -d "$RUNNER_TEMP/cosign-roundtrip.XXXXXX")"
          trap 'rm -rf "$roundtrip_dir"' EXIT
          printf 'release contract\n' > "$roundtrip_dir/artifact"
          (
            cd "$roundtrip_dir"
            COSIGN_PASSWORD='' cosign generate-key-pair
            COSIGN_PASSWORD='' cosign sign-blob --yes --key cosign.key \
              --bundle artifact.sigstore.json artifact
            cosign verify-blob --key cosign.pub \
              --bundle artifact.sigstore.json artifact
          )
          syft scan dir:metadata -o spdx-json > "$roundtrip_dir/sbom.spdx.json"
          jq -e '.spdxVersion | startswith("SPDX-")' "$roundtrip_dir/sbom.spdx.json"

      - name: Select the repository Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: metadata/go.mod
          cache: false

      - name: Verify the selected Go toolchain
        run: go version
