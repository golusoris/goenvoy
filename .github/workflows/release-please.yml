name: release-please

# Keeps one release pull request current. Merging that pull request is the
# publish step: the run on the merge commit creates the module tags and GitHub
# releases, then calls release.yml once per tag for the signed, attested
# artefacts.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # release-please maintains long-lived release PRs; two runs racing on
  # main can produce duplicate PR branches and conflicting manifests.
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tags: ${{ steps.plan.outputs.tags }}
    steps:
      # A release pull request opened with the workflow token starts no checks; the App token does.
      - name: Mint the release token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - id: plan
        name: List the tags this run created
        env:
          PATHS: ${{ steps.rp.outputs.paths_released }}
        run: |
          set -euo pipefail
          tags="$(bash tools/release-manifest.sh tags "${PATHS:-[]}")"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Tags created by this run: $tags"

  # release.yml is called here once per tag; it has no tag trigger, which the
  # App-token tags would otherwise start a second time.
  release:
    name: Release ${{ matrix.tag }}
    needs: release-please
    if: needs.release-please.outputs.tags != '[]'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        tag: ${{ fromJSON(needs.release-please.outputs.tags) }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ matrix.tag }}

  # The CI runs of a pull request opened with the repository token wait for an
  # approval, and main requires the CI success check. A dispatched run does not
  # count for the pull request, so the waiting runs are approved here.
  release-pr-ci:
    name: Run CI on the release pull request
    needs: release-please
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Approve the waiting runs on the release branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/release-pr-ci.sh "$GITHUB_REPOSITORY"
