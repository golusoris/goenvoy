name: release-please

# release-please keeps one release pull request current and creates no GitHub
# release (skip-github-release in release-please-config.json); merging that pull
# request is the publish step: the run on the merge commit creates the module
# tags (tools/release-tag.sh tag), then calls release.yml once per tag, which
# publishes each release only after its signed, attested artefacts are attached
# (tools/release-publish.sh), and relabels the pull request "autorelease: tagged"
# only after every release succeeded (tools/release-tag.sh relabel). A failed
# run is repaired by the next one, because the pull request keeps "autorelease:
# pending" until then.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # release-please maintains long-lived release PRs; two runs racing on
  # main can produce duplicate PR branches and conflicting manifests.
  # One group for every ref: a dispatched run on another branch still reads and tags the main release pull requests.
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tags: ${{ steps.tag.outputs.tags }}
    steps:
      # A release pull request opened with the workflow token starts no checks; the App token does.
      - name: Mint the release token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - id: tag
        name: Tag the merged release pull requests
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          tags="$(bash tools/release-tag.sh tag "$GITHUB_REPOSITORY")"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Tags created or kept by this run: $tags"

  # release.yml is called here once per tag; it has no tag trigger, which the
  # App-token tags would otherwise start a second time.
  release:
    name: Release ${{ matrix.tag }}
    needs: release-please
    if: needs.release-please.outputs.tags != '' && needs.release-please.outputs.tags != '[]'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        tag: ${{ fromJSON(needs.release-please.outputs.tags) }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ matrix.tag }}

  # The release pull request keeps "autorelease: pending" until every release of
  # this run is published, so the next run retries a failed release.
  relabel:
    name: Mark the released pull requests tagged
    needs: release
    if: needs.release.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Relabel the release pull requests whose tags all exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/release-tag.sh relabel "$GITHUB_REPOSITORY"

  # The CI runs of a pull request opened with the repository token wait for an
  # approval, and main requires the CI success check. A dispatched run does not
  # count for the pull request, so the waiting runs are approved here.
  release-pr-ci:
    name: Run CI on the release pull request
    needs: release-please
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Approve the waiting runs on the release branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/release-pr-ci.sh "$GITHUB_REPOSITORY"
