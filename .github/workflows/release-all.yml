name: Release All Modules

# Validation-only workflow for planning a lockstep release. Gitea is canonical;
# this public workflow must never create tags. Once this validation succeeds,
# create immutable tags on canonical Gitea and let its publisher forward them.
#
# Use this to validate a proposed lockstep version without mutating public refs.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver version to release across all modules (e.g. v2.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # The all-module validation is expensive, so serialize manual requests.
  group: release-all
  cancel-in-progress: false

jobs:
  fan-out:
    name: Validate every module
    runs-on: arc-cauda-golusoris-goenvoy
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: metadata/go.mod

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'; then
            echo "::error::Invalid version: $VERSION (expected vX.Y.Z[-pre])"
            exit 1
          fi

      - name: Discover modules
        id: discover
        run: |
          modules=$(find . -name 'go.mod' -not -path './.workingdir*/*' -exec dirname {} \; | sed 's|^\./||' | sort)
          count=$(echo "$modules" | wc -l)
          echo "Found $count modules"
          {
            echo "modules<<EOF"
            echo "$modules"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Validate every module (build + vet + test)
        run: |
          failed=0
          while IFS= read -r mod; do
            [ -z "$mod" ] && continue
            echo "::group::Validating $mod"
            if ! (cd "$mod" && go build ./... && go vet ./... && go test -race -count=1 -timeout=5m ./...); then
              echo "::error::Validation failed for $mod"
              failed=1
            fi
            echo "::endgroup::"
          done <<< "${{ steps.discover.outputs.modules }}"
          [ "$failed" -ne 0 ] && exit 1
          echo "All modules validated."

      - name: Record the canonical release plan
        env:
          VERSION: ${{ inputs.version }}
        run: |
          count=0
          while IFS= read -r mod; do
            [ -z "$mod" ] && continue
            tag="${mod}/${VERSION}"
            echo "$tag"
            count=$((count + 1))
          done <<< "${{ steps.discover.outputs.modules }}"
          {
            echo "### Canonical Gitea release plan"
            echo "- **Version:** $VERSION"
            echo "- **Validated module tags:** $count"
            echo
            echo "No public refs were mutated. Create these immutable tags on canonical Gitea;"
            echo "its publisher will forward them and trigger signed public releases."
          } >> "$GITHUB_STEP_SUMMARY"
