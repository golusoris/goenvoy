name: CI

# Per-module Go gates (lint, gosec, govulncheck, race test + coverage, build)
# delegate to golusoris/golusoris's reusable ci-go.yml, one call per module in
# the `discover` matrix (golusoris/golusoris#184). apidiff stays local: this
# repo tags each module independently (release-please, tag-separator "/", e.g.
# anime/shoko/v1.2.3), and ci-go.yml's apidiff job only knows a single global
# `git describe` tag, which would compare against an unrelated module's most
# recent release in this monorepo. pr-title and the aggregate status gate also
# stay local.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title (Conventional Commits)
    if: github.actor != 'renovate[bot]' && github.event_name == 'pull_request'
    runs-on: arc-cauda-golusoris-goenvoy
    steps:
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$PR_TITLE" | grep -qE '^(feat|fix|docs|chore|refactor|test|perf|ci|build|revert|style)(\(.+\))?(!)?: .+'; then
            echo "::error::PR title does not follow Conventional Commits."
            echo "::error::Got: $PR_TITLE"
            echo "::error::Expected: <type>(<scope>): <description>"
            exit 1
          fi
          echo "OK: $PR_TITLE"

  discover:
    name: Discover modules
    if: github.actor != 'renovate[bot]'
    runs-on: arc-cauda-golusoris-goenvoy
    outputs:
      modules: ${{ steps.find.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: find
        name: Select changed modules (full matrix only when shared config changes)
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          ALL=$(find . -name go.mod -not -path './.workingdir/*' -exec dirname {} \; | sed 's#^\./##' | sort)

          # Diff base: PR base for pull_request, the pushed-from commit otherwise.
          if [ "$EVENT" = "pull_request" ]; then DIFF_BASE="$BASE_SHA"; else DIFF_BASE="$BEFORE_SHA"; fi
          CHANGED=""
          if [ -n "$DIFF_BASE" ] && [ "$DIFF_BASE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${DIFF_BASE}^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$DIFF_BASE" "$HEAD_SHA")
          fi

          # Files whose change can affect every module's gate -> run the full matrix.
          FORCE_FULL_RE='^(\.github/workflows/ci\.yml|\.golangci\.yml|tools/coverage-thresholds\.json)$'
          FULL=false
          if [ -z "$CHANGED" ]; then
            FULL=true   # unknown base (first push, shallow, force-push) -> be safe
          elif echo "$CHANGED" | grep -qE "$FORCE_FULL_RE"; then
            FULL=true
          fi

          if $FULL; then
            SELECTED="$ALL"
            echo "Full matrix (shared config changed or diff base unavailable)."
          else
            # Map each changed file to its nearest ancestor module directory.
            SELECTED=$(while IFS= read -r f; do
              [ -z "$f" ] && continue
              d=$(dirname "$f")
              while :; do
                if printf '%s\n' "$ALL" | grep -qx "$d"; then echo "$d"; break; fi
                [ "$d" = "." ] && break
                d=$(dirname "$d")
              done
            done <<< "$CHANGED" | sort -u)
            echo "Changed modules:"; printf '%s\n' "$SELECTED" | sed 's/^/  /'
          fi

          # The Gitea job image deliberately stays small and does not include
          # jq. Node is guaranteed because JavaScript actions require it.
          # Each matrix entry also carries the module's coverage-threshold
          # (tools/coverage-thresholds.json: per-module override, else the
          # default) so the `ci` job below can pass it straight through to
          # ci-go.yml's `coverage-threshold` input (0 = skip the gate, used
          # for the umbrella packages that have no executable statements).
          modules=$(printf '%s\n' "$SELECTED" | node -e '
            const fs = require("fs");
            let s = "";
            process.stdin.on("data", (c) => { s += c; });
            process.stdin.on("end", () => {
              const mods = s.split(/\r?\n/).filter(Boolean);
              const cfg = JSON.parse(fs.readFileSync("tools/coverage-thresholds.json", "utf8"));
              const overrides = cfg.overrides || {};
              const out = mods.map((m) => ({
                module: m,
                threshold: Object.prototype.hasOwnProperty.call(overrides, m) ? overrides[m] : cfg.default,
              }));
              console.log(JSON.stringify(out));
            });
          ')
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "Selected matrix: $modules"

  # Lint, gosec, govulncheck, race test + coverage, and build for every
  # selected module, via the framework's reusable workflow. `skip-apidiff` is
  # set because this repo's apidiff needs per-module tag prefixes (see the
  # `apidiff` job below) that the reusable job's global `git describe` can't
  # reproduce in a 69-module monorepo.
  ci:
    name: CI (${{ matrix.module }})
    if: github.actor != 'renovate[bot]'
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.modules) }}
    permissions:
      contents: read
      security-events: write   # gosec SARIF upload inside ci-go.yml (capped by this grant)
    uses: golusoris/golusoris/.github/workflows/ci-go.yml@380b26797a8552c8b8aba03d53209b8997f2b1be # v0.10.1
    with:
      runs-on: arc-cauda-golusoris-goenvoy
      working-directory: ${{ matrix.module }}
      go-version-file: ${{ matrix.module }}/go.mod
      golangci-version: v2.13.2
      test-timeout: 5m
      needs-docker: false
      coverage-threshold: ${{ matrix.threshold }}
      skip-apidiff: true

  apidiff:
    name: apidiff ${{ matrix.module }}
    if: github.actor != 'renovate[bot]'
    needs: discover
    runs-on: arc-cauda-golusoris-goenvoy
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.mod
      - name: Install apidiff
        run: go install golang.org/x/exp/cmd/apidiff@v0.0.0-20260410095643-746e56fc9e2f
      - name: Run apidiff for ${{ matrix.module }}
        env:
          MODULE_DIR: ${{ matrix.module }}
        run: |
          set -euo pipefail
          MOD_PATH=${MODULE_DIR#./}
          TAG_PREFIX="${MOD_PATH}/v"
          PREV_TAG=$(git tag --list --sort=-v:refname "${TAG_PREFIX}*" | head -1 || true)
          if [ -z "$PREV_TAG" ]; then
            echo "No previous ${TAG_PREFIX}* tag — skipping (first release)."
            exit 0
          fi

          PREV_SHA=$(git rev-parse "$PREV_TAG^{commit}")
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$PREV_SHA" = "$HEAD_SHA" ]; then
            echo "PREV_TAG $PREV_TAG already at HEAD — nothing to diff."
            exit 0
          fi

          # Source-only fast path: if no .go file under $MOD_PATH changed
          # between PREV_TAG and HEAD, the public surface can't have moved.
          if git diff --quiet "$PREV_TAG" HEAD -- "$MOD_PATH/*.go" "$MOD_PATH/**/*.go"; then
            echo "No .go changes in $MOD_PATH since $PREV_TAG — skipping apidiff."
            exit 0
          fi

          echo "Comparing $MOD_PATH against $PREV_TAG"

          MOD_IMPORT=$(cd "$MOD_PATH" && go list -m)

          # Use a detached worktree for the previous tag so we never mutate
          # the primary checkout (cleaner than stash + checkout).
          PREV_WT=$(mktemp -d)
          git worktree add --detach --quiet "$PREV_WT" "$PREV_TAG"
          trap 'git worktree remove --force "$PREV_WT" >/dev/null 2>&1 || true' EXIT

          # If the module path has been renamed between PREV_TAG and HEAD
          # (lusoris → golusoris, or a /vN major-version path bump), apidiff
          # can't load the old fingerprint under the new name. A rename is
          # a breaking change by definition, so it's on the release author
          # to cut a new baseline tag — we skip the gate until one exists.
          PREV_MOD_IMPORT=$(cd "$PREV_WT/$MOD_PATH" && go list -m)
          if [ "$PREV_MOD_IMPORT" != "$MOD_IMPORT" ]; then
            echo "Module path changed ($PREV_MOD_IMPORT → $MOD_IMPORT) — tag a fresh baseline on the new path before apidiff can resume. Skipping."
            exit 0
          fi

          # apidiff -w consults the module in the current directory's go.mod,
          # so write each fingerprint from inside its own module directory.
          ( cd "$PREV_WT/$MOD_PATH" && apidiff -m -w /tmp/prev.fp "$MOD_IMPORT" )
          ( cd "$MOD_PATH"          && apidiff -m -w /tmp/cur.fp  "$MOD_IMPORT" )

          if [ ! -s /tmp/prev.fp ] || [ ! -s /tmp/cur.fp ]; then
            echo "::error::apidiff produced an empty fingerprint (prev=$(stat -c%s /tmp/prev.fp) current=$(stat -c%s /tmp/cur.fp)) — investigate the previous-tag build."
            exit 1
          fi

          # apidiff exits 0 even when it finds incompatible changes, so the gate
          # keys off the -incompatible output (module fingerprints compare with -m).
          if ! INCOMPAT=$(apidiff -incompatible -m /tmp/prev.fp /tmp/cur.fp 2>&1); then
            echo "::error::apidiff comparison failed: $INCOMPAT"
            exit 1
          fi
          if [ -n "$INCOMPAT" ]; then
            echo "::error::Breaking API change in $MOD_PATH vs $PREV_TAG — bump the module major version (/vN) or revert the break:"
            echo "$INCOMPAT"
            exit 1
          fi
          echo "API backwards-compatible with $PREV_TAG."

  status:
    name: CI Status
    if: always() && github.actor != 'renovate[bot]'
    needs: [ci, apidiff]
    runs-on: arc-cauda-golusoris-goenvoy
    steps:
      - name: Check results
        run: |
          for j in ci apidiff; do
            case "$(eval echo \$${j}_result)" in ""|success|skipped) ;; *)
              echo "job $j: $(eval echo \$${j}_result)"; exit 1 ;;
            esac
          done
          echo "All checks passed."
        env:
          ci_result: ${{ needs.ci.result }}
          apidiff_result: ${{ needs.apidiff.result }}
