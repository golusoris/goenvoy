name: CI

# Per-module Go gates (lint, gosec, govulncheck, race test + coverage, build)
# delegate to golusoris/golusoris's reusable ci-go.yml, one call per module in
# the `discover` matrix (golusoris/golusoris#184). apidiff stays local: this
# repo tags each module independently (release-please, tag-separator "/", e.g.
# anime/shoko/v1.2.3), and ci-go.yml's apidiff job only knows a single global
# `git describe` tag, which would compare against an unrelated module's most
# recent release in this monorepo. pr-title, the workflow-file gate
# (tools/workflow-check.sh), the release manifest gate
# (tools/release-manifest.sh) and the aggregate status gate also stay local.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title (Conventional Commits)
    # Unconditional, so the check reports on every pull request and the
    # ruleset can require it: a job a condition skips reports success. A
    # manual run has no pull request title and passes in the step instead.
    runs-on: ubuntu-26.04
    steps:
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "No pull request: nothing to check."
            exit 0
          fi
          if ! echo "$PR_TITLE" | grep -qE '^(feat|fix|docs|chore|refactor|test|perf|ci|build|revert|style)(\(.+\))?(!)?: .+'; then
            echo "::error::PR title does not follow Conventional Commits."
            echo "::error::Got: $PR_TITLE"
            echo "::error::Expected: <type>(<scope>): <description>"
            exit 1
          fi
          echo "OK: $PR_TITLE"

  # Runs on every pull request: a change that touches no module skips the
  # matrices below, and the workflow files and the release manifest are then
  # all that is left to gate.
  workflows:
    name: Workflows (actionlint, pinned actions)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check refuses its planted cases
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/workflow-check_test.sh
      - name: Lint workflows and check action pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/workflow-check.sh
      - name: Release manifest check refuses its planted cases
        run: bash tools/release-manifest_test.sh
      - name: Release manifest versions match the module paths
        run: bash tools/release-manifest.sh check
      - name: Release pull request run approval refuses its planted cases
        run: bash tools/release-pr-ci_test.sh

  # The upstream OpenAPI spec pins (upstream/specs.yaml): the checker refuses
  # its planted cases, then every pinned file must still have its sha256.
  # Runs on every pull request; a scheduled run is not needed, because a pin
  # names a commit, whose files do not change.
  upstream-specs:
    name: Upstream spec pins
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools-go
      - name: Check the pins
        run: make upstream-specs

  # The complexity limits hold for every Go file; the dated per-file test
  # exceptions in .golangci.yml expire, and this job fails once one has (#141).
  lint-exceptions:
    name: Dated lint exceptions
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools-go
      - name: Check the exceptions
        run: make lint-exceptions

  # gitleaks scans every commit, not only the tip; GitHub push protection is the
  # other barrier (#77). Pinned by version and sha256 in tools/tool-versions.env.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . tools/tool-versions.env
          curl -fsSL --max-time 120 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --exit-code 1 .'

  discover:
    name: Discover modules
    runs-on: ubuntu-26.04
    outputs:
      modules: ${{ steps.find.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: find
        name: Select changed modules (full matrix only when shared config changes)
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          ALL=$(find . -name go.mod -not -path './.workingdir/*' -not -path './tools/go/*' -exec dirname {} \; | sed 's#^\./##' | sort)

          # Diff base: PR base for pull_request, the pushed-from commit otherwise.
          if [ "$EVENT" = "pull_request" ]; then DIFF_BASE="$BASE_SHA"; else DIFF_BASE="$BEFORE_SHA"; fi
          CHANGED=""
          if [ -n "$DIFF_BASE" ] && [ "$DIFF_BASE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${DIFF_BASE}^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$DIFF_BASE" "$HEAD_SHA")
          fi

          # Files whose change can affect every module's gate -> run the full matrix.
          FORCE_FULL_RE='^(\.github/workflows/ci\.yml|\.golangci\.yml|tools/coverage-thresholds\.json)$'
          FULL=false
          if [ -z "$CHANGED" ]; then
            FULL=true   # unknown base (first push, shallow, force-push) -> be safe
          elif echo "$CHANGED" | grep -qE "$FORCE_FULL_RE"; then
            FULL=true
          fi

          if $FULL; then
            SELECTED="$ALL"
            echo "Full matrix (shared config changed or diff base unavailable)."
          else
            # Map each changed file to its nearest ancestor module directory.
            SELECTED=$(while IFS= read -r f; do
              [ -z "$f" ] && continue
              d=$(dirname "$f")
              # A path has fewer than 64 directory levels.
              depth=0
              while [ "$depth" -lt 64 ]; do
                depth=$((depth + 1))
                if printf '%s\n' "$ALL" | grep -qx "$d"; then echo "$d"; break; fi
                [ "$d" = "." ] && break
                d=$(dirname "$d")
              done
            done <<< "$CHANGED" | sort -u)
            echo "Changed modules:"; printf '%s\n' "$SELECTED" | sed 's/^/  /'
          fi

          # Node builds the matrix: it is always present, because JavaScript
          # actions require it.
          # Each matrix entry also carries the module's coverage-threshold
          # (tools/coverage-thresholds.json: per-module override, else the
          # default) so the `ci` job below can pass it straight through to
          # ci-go.yml's `coverage-threshold` input (0 = skip the gate, used
          # for the umbrella packages that have no executable statements).
          modules=$(printf '%s\n' "$SELECTED" | node -e '
            const fs = require("fs");
            let s = "";
            process.stdin.on("data", (c) => { s += c; });
            process.stdin.on("end", () => {
              const mods = s.split(/\r?\n/).filter(Boolean);
              const cfg = JSON.parse(fs.readFileSync("tools/coverage-thresholds.json", "utf8"));
              const overrides = cfg.overrides || {};
              const out = mods.map((m) => ({
                module: m,
                threshold: Object.prototype.hasOwnProperty.call(overrides, m) ? overrides[m] : cfg.default,
              }));
              console.log(JSON.stringify(out));
            });
          ')
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "Selected matrix: $modules"

  # Lint, gosec, govulncheck, race test + coverage, and build for every
  # selected module, via the framework's reusable workflow. `skip-apidiff` is
  # set because this repo's apidiff needs per-module tag prefixes (see the
  # `apidiff` job below) that the reusable job's global `git describe` can't
  # reproduce in a 69-module monorepo.
  ci:
    name: CI (${{ matrix.module }})
    needs: discover
    # An empty matrix is a job failure, so a change outside every module skips.
    if: needs.discover.outputs.modules != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.modules) }}
    permissions:
      contents: read
      security-events: write   # gosec SARIF upload inside ci-go.yml (capped by this grant)
    uses: golusoris/golusoris/.github/workflows/ci-go.yml@17e4510055d749a05dc3031228c021664599c5cc # v0.20.0
    with:
      runs-on: ubuntu-26.04
      working-directory: ${{ matrix.module }}
      go-version-file: ${{ matrix.module }}/go.mod
      golangci-version: v2.13.2
      test-timeout: 5m
      needs-docker: false
      coverage-threshold: ${{ matrix.threshold }}
      skip-apidiff: true

  apidiff:
    name: apidiff ${{ matrix.module }}
    needs: discover
    # An empty matrix is a job failure, so a change outside every module skips.
    if: needs.discover.outputs.modules != '[]'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.mod
      - name: Install apidiff
        run: go install golang.org/x/exp/cmd/apidiff@v0.0.0-20260410095643-746e56fc9e2f
      - name: Run apidiff for ${{ matrix.module }}
        env:
          MODULE_DIR: ${{ matrix.module }}
        run: |
          set -euo pipefail
          MOD_PATH=${MODULE_DIR#./}
          TAG_PREFIX="${MOD_PATH}/v"
          # The newest tag is the first line; no pipe into head, whose early exit
          # would fail the pipeline under pipefail.
          PREV_TAG=$(git tag --list --sort=-v:refname "${TAG_PREFIX}*")
          PREV_TAG=${PREV_TAG%%$'\n'*}
          if [ -z "$PREV_TAG" ]; then
            echo "No previous ${TAG_PREFIX}* tag — skipping (first release)."
            exit 0
          fi

          PREV_SHA=$(git rev-parse "$PREV_TAG^{commit}")
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$PREV_SHA" = "$HEAD_SHA" ]; then
            echo "PREV_TAG $PREV_TAG already at HEAD — nothing to diff."
            exit 0
          fi

          # Source-only fast path: if no .go file under $MOD_PATH changed
          # between PREV_TAG and HEAD, the public surface can't have moved.
          if git diff --quiet "$PREV_TAG" HEAD -- "$MOD_PATH/*.go" "$MOD_PATH/**/*.go"; then
            echo "No .go changes in $MOD_PATH since $PREV_TAG — skipping apidiff."
            exit 0
          fi

          echo "Comparing $MOD_PATH against $PREV_TAG"

          MOD_IMPORT=$(cd "$MOD_PATH" && go list -m)

          # Use a detached worktree for the previous tag so we never mutate
          # the primary checkout (cleaner than stash + checkout).
          PREV_WT=$(mktemp -d)
          git worktree add --detach --quiet "$PREV_WT" "$PREV_TAG"
          trap 'git worktree remove --force "$PREV_WT" >/dev/null 2>&1 || true' EXIT

          # If the module path has been renamed between PREV_TAG and HEAD
          # (lusoris → golusoris, or a /vN major-version path bump), apidiff
          # can't load the old fingerprint under the new name. A rename is
          # a breaking change by definition, so it's on the release author
          # to cut a new baseline tag — we skip the gate until one exists.
          PREV_MOD_IMPORT=$(cd "$PREV_WT/$MOD_PATH" && go list -m)
          if [ "$PREV_MOD_IMPORT" != "$MOD_IMPORT" ]; then
            echo "Module path changed ($PREV_MOD_IMPORT → $MOD_IMPORT) — tag a fresh baseline on the new path before apidiff can resume. Skipping."
            exit 0
          fi

          # apidiff -w consults the module in the current directory's go.mod,
          # so write each fingerprint from inside its own module directory.
          ( cd "$PREV_WT/$MOD_PATH" && apidiff -m -w /tmp/prev.fp "$MOD_IMPORT" )
          ( cd "$MOD_PATH"          && apidiff -m -w /tmp/cur.fp  "$MOD_IMPORT" )

          if [ ! -s /tmp/prev.fp ] || [ ! -s /tmp/cur.fp ]; then
            echo "::error::apidiff produced an empty fingerprint (prev=$(stat -c%s /tmp/prev.fp) current=$(stat -c%s /tmp/cur.fp)) — investigate the previous-tag build."
            exit 1
          fi

          # apidiff exits 0 even when it finds incompatible changes, so the gate
          # keys off the -incompatible output (module fingerprints compare with -m).
          if ! INCOMPAT=$(apidiff -incompatible -m /tmp/prev.fp /tmp/cur.fp 2>&1); then
            echo "::error::apidiff comparison failed: $INCOMPAT"
            exit 1
          fi
          if [ -n "$INCOMPAT" ]; then
            echo "::error::Breaking API change in $MOD_PATH vs $PREV_TAG — bump the module major version (/vN) or revert the break:"
            echo "$INCOMPAT"
            exit 1
          fi
          echo "API backwards-compatible with $PREV_TAG."

  # The single required CI check. It has no actor condition: a job skipped by
  # a condition reports success to branch protection, so a skip here would let
  # a pull request merge with no CI run.
  status:
    name: CI success
    if: always()
    needs: [workflows, upstream-specs, lint-exceptions, secret-scan, discover, ci, apidiff]
    runs-on: ubuntu-26.04
    steps:
      - name: Check results
        run: |
          for j in workflows upstream_specs lint_exceptions secret_scan discover; do
            var="${j}_result"; got="${!var}"
            if [ "$got" != success ]; then
              echo "job $j: $got"; exit 1
            fi
          done
          # A skipped matrix job counts only when discover selected no module.
          want=success
          if [ "$modules" = '[]' ]; then
            want=skipped
            echo "No module changed: the ci and apidiff matrices are empty and skipped."
          fi
          for j in ci apidiff; do
            var="${j}_result"; got="${!var}"
            if [ "$got" != "$want" ]; then
              echo "job $j: $got (expected $want)"; exit 1
            fi
          done
          echo "All checks passed."
        env:
          modules: ${{ needs.discover.outputs.modules }}
          workflows_result: ${{ needs.workflows.result }}
          upstream_specs_result: ${{ needs.upstream-specs.result }}
          lint_exceptions_result: ${{ needs.lint-exceptions.result }}
          secret_scan_result: ${{ needs.secret-scan.result }}
          discover_result: ${{ needs.discover.result }}
          ci_result: ${{ needs.ci.result }}
          apidiff_result: ${{ needs.apidiff.result }}
