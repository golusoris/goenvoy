name: Release

on:
  push:
    tags:
      - '**/v[0-9]*.[0-9]*.[0-9]*'
      - '**/v[0-9]*.[0-9]*.[0-9]*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing canonical tag to (re)release, e.g. anime/v1.3.0, when retrying a missed tag-triggered run.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # One release run per tag. Tag releases are immutable, so serialising
  # per tag prevents two dispatches (push + workflow_dispatch) racing on
  # the same GH Release and clobbering each other's artefacts.
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release tagged module
    runs-on: arc-cauda-golusoris-goenvoy
    permissions:
      contents: write       # create GH Release + upload artefacts
      id-token: write       # cosign keyless + SLSA
      attestations: write   # attest-build-provenance
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Parse tag
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$DISPATCH_TAG" ]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          MOD_PATH="${TAG%/v*}"
          VERSION="v${TAG##*/v}"
          {
            echo "tag=$TAG"
            echo "module=$MOD_PATH"
            echo "version=$VERSION"
            echo "dir=./$MOD_PATH"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: ${{ steps.tag.outputs.dir }}/go.mod
          cache-dependency-path: ${{ steps.tag.outputs.dir }}/go.mod

      - name: Validate the tagged module
        working-directory: ${{ steps.tag.outputs.dir }}
        run: |
          go build ./...
          go vet ./...
          go test -race -count=1 ./...

      - name: Verify pre-baked supply-chain tools
        shell: bash
        run: |
          set -euo pipefail
          command -v cosign
          command -v syft
          cosign version | grep -Eq 'GitVersion:[[:space:]]+v?3\.1\.3([[:space:]]|$)'
          syft version | grep -Eq 'Version:[[:space:]]+1\.51\.1([[:space:]]|$)'

      - name: Package source tarball
        id: pkg
        env:
          MOD: ${{ steps.tag.outputs.module }}
          VER: ${{ steps.tag.outputs.version }}
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          BASENAME="$(echo "$MOD" | tr '/' '_')_${VER}_source"
          TARBALL="${GITHUB_WORKSPACE}/dist/${BASENAME}.tar.gz"
          (cd "${MOD}" && \
             find . -type f -not -path './coverage.out' -not -name '*.out' \
             | sort | LC_ALL=C tar --owner=0 --group=0 --numeric-owner \
             --mtime='@0' --sort=name --no-recursion -czf "${TARBALL}" -T - )
          (cd "${GITHUB_WORKSPACE}/dist" && sha256sum "${BASENAME}.tar.gz" > "${BASENAME}.checksums.txt")
          echo "basename=${BASENAME}" >> "$GITHUB_OUTPUT"

      - name: SBOM (syft → SPDX)
        run: |
          syft packages dir:${{ steps.tag.outputs.dir }} -o spdx-json > dist/${{ steps.pkg.outputs.basename }}.sbom.spdx.json

      - name: Sign release artefacts (cosign keyless)
        env:
          BASENAME: ${{ steps.pkg.outputs.basename }}
        run: |
          set -euo pipefail
          # Native Sigstore bundles contain the signature, certificate and
          # transparency-log proof, and OpenSSF Scorecard recognizes the
          # .sigstore.json suffix for Signed-Releases.
          IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          for f in "${BASENAME}.tar.gz" "${BASENAME}.checksums.txt" "${BASENAME}.sbom.spdx.json"; do
            cosign sign-blob --yes \
              --bundle "dist/${f}.sigstore.json" \
              "dist/${f}"
            cosign verify-blob \
              --bundle "dist/${f}.sigstore.json" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "dist/${f}"
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-path: |
            dist/${{ steps.pkg.outputs.basename }}.tar.gz
            dist/${{ steps.pkg.outputs.basename }}.checksums.txt
            dist/${{ steps.pkg.outputs.basename }}.sbom.spdx.json

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          MOD: ${{ steps.tag.outputs.module }}
          VER: ${{ steps.tag.outputs.version }}
          BASENAME: ${{ steps.pkg.outputs.basename }}
        run: |
          # A retry or manual dispatch may find an existing release. Upload
          # the signed artefacts idempotently instead of failing.
          ASSETS=(
            "dist/${BASENAME}.tar.gz"
            "dist/${BASENAME}.tar.gz.sigstore.json"
            "dist/${BASENAME}.checksums.txt"
            "dist/${BASENAME}.checksums.txt.sigstore.json"
            "dist/${BASENAME}.sbom.spdx.json"
            "dist/${BASENAME}.sbom.spdx.json.sigstore.json"
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" \
              --title "$MOD $VER" \
              --generate-notes \
              "${ASSETS[@]}"
          fi
