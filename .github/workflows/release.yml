name: Release

on:
  # release-please.yml calls this once per tag it created.
  workflow_call:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. anime/v1.3.0.'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)release, e.g. anime/v1.3.0, when retrying a failed release run.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # One release run per tag. Tag releases are immutable, so serialising
  # per tag prevents two runs (call or dispatch) racing on the
  # same GH Release and clobbering each other's artefacts.
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release tagged module
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write       # create GH Release + upload artefacts
      id-token: write       # cosign keyless + SLSA
      attestations: write   # attest-build-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Parse tag
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$DISPATCH_TAG" ]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          MOD_PATH="${TAG%/v*}"
          VERSION="v${TAG##*/v}"
          {
            echo "tag=$TAG"
            echo "module=$MOD_PATH"
            echo "version=$VERSION"
            echo "dir=./$MOD_PATH"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ steps.tag.outputs.dir }}/go.mod
          cache-dependency-path: ${{ steps.tag.outputs.dir }}/go.mod

      - name: Validate the tagged module
        working-directory: ${{ steps.tag.outputs.dir }}
        run: |
          go build ./...
          go vet ./...
          go test -race -count=1 ./...

      # Why: release tooling comes from this workflow's commit, so a retried old tag gets current pins.
      - name: Check out the release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false
          sparse-checkout: .github/actions/install-release-tools

      - uses: ./.release-tools/.github/actions/install-release-tools

      - name: Package source tarball
        id: pkg
        env:
          MOD: ${{ steps.tag.outputs.module }}
          VER: ${{ steps.tag.outputs.version }}
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          BASENAME="$(echo "$MOD" | tr '/' '_')_${VER}_source"
          TARBALL="${GITHUB_WORKSPACE}/dist/${BASENAME}.tar.gz"
          (cd "${MOD}" && \
             find . -type f -not -path './coverage.out' -not -name '*.out' \
             | sort | LC_ALL=C tar --owner=0 --group=0 --numeric-owner \
             --mtime='@0' --sort=name --no-recursion -czf "${TARBALL}" -T - )
          (cd "${GITHUB_WORKSPACE}/dist" && sha256sum "${BASENAME}.tar.gz" > "${BASENAME}.checksums.txt")
          echo "basename=${BASENAME}" >> "$GITHUB_OUTPUT"

      - name: SBOM (syft → SPDX)
        run: |
          syft scan dir:${{ steps.tag.outputs.dir }} -o spdx-json > dist/${{ steps.pkg.outputs.basename }}.sbom.spdx.json

      - name: Sign release artefacts (cosign keyless)
        env:
          BASENAME: ${{ steps.pkg.outputs.basename }}
        run: |
          set -euo pipefail
          # Native Sigstore bundles contain the signature, certificate and
          # transparency-log proof, and OpenSSF Scorecard recognizes the
          # .sigstore.json suffix for Signed-Releases.
          # The certificate names this file at the ref of the run: the tag
          # for a tag push, the branch for a dispatch or a call.
          IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          for f in "${BASENAME}.tar.gz" "${BASENAME}.checksums.txt" "${BASENAME}.sbom.spdx.json"; do
            cosign sign-blob --yes \
              --bundle "dist/${f}.sigstore.json" \
              "dist/${f}"
            cosign verify-blob \
              --bundle "dist/${f}.sigstore.json" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "dist/${f}"
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/${{ steps.pkg.outputs.basename }}.tar.gz
            dist/${{ steps.pkg.outputs.basename }}.checksums.txt
            dist/${{ steps.pkg.outputs.basename }}.sbom.spdx.json

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          MOD: ${{ steps.tag.outputs.module }}
          VER: ${{ steps.tag.outputs.version }}
          BASENAME: ${{ steps.pkg.outputs.basename }}
        run: |
          # A retry or manual dispatch may find an existing release. Upload
          # the signed artefacts idempotently instead of failing.
          ASSETS=(
            "dist/${BASENAME}.tar.gz"
            "dist/${BASENAME}.tar.gz.sigstore.json"
            "dist/${BASENAME}.checksums.txt"
            "dist/${BASENAME}.checksums.txt.sigstore.json"
            "dist/${BASENAME}.sbom.spdx.json"
            "dist/${BASENAME}.sbom.spdx.json.sigstore.json"
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" \
              --title "$MOD $VER" \
              --generate-notes \
              "${ASSETS[@]}"
          fi
