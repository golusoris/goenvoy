self-hosted-runner:
  # Labels the pinned actionlint cannot know by itself: goenvoy's own
  # self-hosted runner set, which the Scorecard workflow still names, the
  # runner label of the retired .gitea/workflows/ files, and the
  # ubuntu-26.04 hosted image. golusoris/golusoris's ci-go.yml
  # (consumed via `uses:` in ci.yml) carries its own actionlint config.
  labels:
    - arc-cauda-golusoris-goenvoy
    - cauda-k8s-office-canary
    - ubuntu-26.04
