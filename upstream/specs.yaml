# Upstream OpenAPI specs, pinned once for every consumer (README.md in this folder).
#
# Each entry fixes one spec file at one commit of an upstream release, with the sha256 of that
# file. No spec bytes are committed: the Sonarr, Radarr, Lidarr and Readarr-fork specs are
# GPL-3.0 and this repository is MIT. `make upstream-specs` downloads every pinned file and
# refuses one whose sha256 differs; nothing is written to disk.
#
# Renovate reads repository, tag and commit, in this order (customManagers in renovate.json), and
# proposes the next stable upstream release. A project that tags no release is pinned with
# `branch` in the place of `tag`; Renovate then proposes the newest commit of that branch. When
# the spec file changed with the proposed commit, the sha256 no longer fits and the check fails
# until the pin is renewed by hand; the failure prints the sha256 of the new file.
#
# prefix: the part of each request path the spec leaves to its `servers` entry.
specs:
