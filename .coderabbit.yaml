# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
---
reviews:
  auto_review:
    drafts: true
    # Why: 0 = never pause; release-please PRs take a push per merge.
    auto_pause_after_reviewed_commits: 0
    base_branches:
      - .*
  path_instructions:
    - path: "**"
      instructions: |-
        AGENTS.md and CLAUDE.md turn-end rules, including `make verify-all`,
        bind coding agents working in this repository, not the CodeRabbit
        reviewer. No workflow in .github/workflows runs `make verify-all`;
        do not ask for CI evidence of that target. Judge a pull request by
        the per-module CI jobs it triggers.
  # Why: release-please title is fixed (one combined release PR); accept it.
  pre_merge_checks:
    title:
      mode: warning
      requirements: |-
        Titles follow Conventional Commits type(scope): summary with the
        types the pr-title job in .github/workflows/ci.yml accepts; the
        summary says what changes. Release pull requests opened by
        release-please carry the fixed title "chore: release main" because
        this repository releases all modules in one combined pull request
        whose body names each module version; that title passes as it is.
