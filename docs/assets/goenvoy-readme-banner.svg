<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="goenvoy — pure-stdlib Go client libraries for media automation, metadata, and download APIs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#111a35"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="120" rx="12" fill="url(#bg)"/>

  <!-- API routing and dispatch network -->
  <g fill="none" stroke-linecap="round">
    <path d="M780 60 C 840 25, 900 95, 980 45 S 1080 85, 1150 40"
          stroke="url(#glow)" stroke-width="12"/>
    <path d="M780 60 C 840 25, 900 95, 980 45 S 1080 85, 1150 40"
          stroke="url(#accent)" stroke-width="2.5" opacity="0.95"/>
    <path d="M780 60 C 850 85, 920 30, 1000 75 S 1090 40, 1150 80"
          stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.6"/>
  </g>
  <g stroke-width="2">
    <circle cx="780" cy="60" r="5" stroke="#06b6d4" fill="#0b1020"/>
    <circle cx="910" cy="55" r="4" stroke="#3b82f6" fill="#111a35"/>
    <circle cx="980" cy="45" r="6" stroke="#8b5cf6" fill="#0b1020"/>
    <circle cx="1060" cy="68" r="4" stroke="#06b6d4" fill="#111a35"/>
    <circle cx="1150" cy="40" r="5" stroke="#3b82f6" fill="#0b1020"/>
    <circle cx="1150" cy="80" r="4" stroke="#8b5cf6" fill="#111a35"/>
  </g>

  <text x="44" y="74" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="64" font-weight="700" fill="#f8fafc" letter-spacing="-1">go<tspan fill="url(#accent)">envoy</tspan></text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#94a3b8">
    <text x="340" y="52">Pure-stdlib Go client libraries · 69 modules</text>
    <text x="340" y="76">Arr stack · Metadata · Download clients · Media servers</text>
  </g>
</svg>
