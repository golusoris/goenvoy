---
version: 1
repository:
  owner: golusoris
  name: goenvoy
  visibility: public
  description: "Go client libraries for media automation, metadata, and download APIs — 62 zero-dependency modules"
  homepage: "https://pkg.go.dev/github.com/lusoris/goenvoy"
  topics:
    - api-client
    - arr
    - go
    - golang
    - jellyfin
    - media-automation
    - media-server
    - metadata
    - plex
    - radarr
    - sonarr
    - tmdb
    - torrent
    - usenet
profiles:
  - library-client
facets:
  - security:high
  - api:public-contract
  - docs:seo-portal
  - agent:sandboxed
overrides:
  branch_protection:
    enforce_linear_history: false
    require_signed_commits: false
    required_approving_reviewers: 0
    dismiss_stale_reviews: false
    review_mode: single_maintainer
register:
  sources:
    expected: 13
    sha256:
      sha256:ffc054cf234981c9a22b3f8a70bcf1249d9477fb29f751c062d8557c81427a3e
    inputs:
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: operating_contract.*
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: invariants.*
documentation:
  # release-please writes each module CHANGELOG.md with two blank lines under every version
  # heading (MD012); the files are generated release surfaces, as the root CHANGELOG.md is.
  style_exclude:
    - "**/CHANGELOG.md"
exceptions:
  - rule: declared-linters
    tool: golangci-lint
    reason: 'category D: golangci-lint runs in the pinned reusable workflow golusoris/golusoris ci-go.yml (ci.yml job ci, golangci-version v2.13.2); audit does not read remote reusable workflows; manifest caps expiry at 90 days'
    expires: "2027-01-16"
  - rule: HISS-19
    path: arr/jackett/jackett.go
    reason: 'category D (ledger golusoris-goenvoy-dc-exceptions-20261018): catParams query builder repeated in two separate Go modules; folding needs a new inter-module require; manifest caps expiry at 90 days'
    expires: "2027-01-17"
  - rule: HISS-19
    path: arr/nzbhydra/nzbhydra.go
    reason: 'category D (ledger golusoris-goenvoy-dc-exceptions-20261018): catParams query builder repeated in two separate Go modules; folding needs a new inter-module require; manifest caps expiry at 90 days'
    expires: "2027-01-17"
  - rule: HISS-19
    path: mediaserver/emby/emby.go
    reason: 'category D (ledger golusoris-goenvoy-dc-exceptions-20261018): GetItemsByParent repeated in the emby and jellyfin modules; folding needs a new inter-module require; manifest caps expiry at 90 days'
    expires: "2027-01-17"
  - rule: HISS-19
    path: mediaserver/jellyfin/jellyfin.go
    reason: 'category D (ledger golusoris-goenvoy-dc-exceptions-20261018): GetItemsByParent repeated in the emby and jellyfin modules; folding needs a new inter-module require; manifest caps expiry at 90 days'
    expires: "2027-01-17"
