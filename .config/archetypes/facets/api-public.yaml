---
id: "api:public-contract"
name: "Public API Contract & Stability"
description: "Append-only API evolution per HISS-14 of the extended spec
  (docs/standards/hiss-spec.md): forge check-commits gates the breaking-change
  Migration: footer, and where git tracks a go.mod, adoption adds the Go API
  Compatibility workflow, which compares the exported API of every Go module
  with go-apidiff; no other language's API is compared"

branch_protection:
  enforce_linear_history: true
  require_signed_commits: true
  required_approving_reviewers: 2
  dismiss_stale_reviews: true

linters:
  - "buf"
  - "spectral"

devcontainer_features:
  - "ghcr.io/devcontainers/features/common-utils:2"
