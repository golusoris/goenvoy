rules:
  - id: test-fatal-in-http-handler
    message: "Code holding the http.ResponseWriter runs on the server goroutine; report with t.Errorf (or t.Error / t.Fail) and return."
    severity: ERROR
    languages: [go]
    patterns:
      - pattern-either:
          - pattern-inside: |
              func(..., $W http.ResponseWriter, ...) {
                ...
              }
          - pattern-inside: |
              func $F(..., $W http.ResponseWriter, ...) {
                ...
              }
          - pattern-inside: |
              func ($S $RT) $F(..., $W http.ResponseWriter, ...) {
                ...
              }
      - pattern-either:
          - pattern: $T.Fatal(...)
          - pattern: $T.Fatalf(...)
          - pattern: $T.FailNow()
          - pattern: $T.Skip(...)
          - pattern: $T.Skipf(...)
          - pattern: $T.SkipNow()
