name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: CI gate
    runs-on: cauda-k8s-office-canary
    container:
      image: harbor.infra.cauda.dev/library/gitea-actions-job:2.335.1-cauda3-gitea3@sha256:ca08d1bee54628ae8713133ae4bf2fe7f06a20a6db6ffd1d184f6ac63660297b
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Validate pull-request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -eu
          echo "$PR_TITLE" | grep -qE '^(feat|fix|docs|chore|refactor|test|perf|ci|build|revert|style)(\(.+\))?(!)?: .+' ||
            { echo "::error::pull-request title is not Conventional Commits"; exit 1; }
      - name: Verify pinned gate tools
        run: |
          set -eux
          verify-gitea-job-tools
          command -v jq golangci-lint gosec govulncheck
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: metadata/go.mod
          cache: true
          cache-dependency-path: |
            **/go.mod
            **/go.sum
      - name: Run the documented full gate
        run: make ci-all
      - name: Remove generated coverage files
        if: always()
        run: make clean-all
