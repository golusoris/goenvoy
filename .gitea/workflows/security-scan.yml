# Static analysis that can actually run on this Gitea instance.
#
# Replaces CodeQL, which failed at "Initialize CodeQL" every time: the action
# needs GitHub's CodeQL infrastructure and uploads to the security-events API,
# neither of which exists here. That failure kept every PR red and burned the
# shared runner that also builds the cluster's images.
#
# Semgrep runs fully inside its own container. The immutable comprehensive job
# image supplies the verified Docker CLI; the workflow only discovers the dind
# gateway. Rulesets come from the public registry without an account; `--config
# auto` is deliberately NOT used because it reports the project URL.
name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitea-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep analysis
    runs-on: cauda-k8s-office-canary
    container:
      image: harbor.infra.cauda.dev/library/gitea-actions-job:2.335.1-cauda2-gitea1@sha256:fb84eb8ecbc7806e18d407a410f098fccc92b6726a7987baf64e98b7350fa0c6
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Locate the dind daemon
        shell: bash
        run: |
          set -euo pipefail
          command -v docker
          # act puts each job on its OWN network, so the bridge gateway is not a
          # stable address and the job container has no /var/run/docker.sock.
          # The job's default gateway is always the dind host; iproute2 is not
          # guaranteed in the image, so fall back to decoding /proc/net/route.
          gw=$(ip route 2>/dev/null | awk '/^default/{print $3; exit}' || true)
          if [ -z "$gw" ]; then
            h=$(awk '$2=="00000000"{print $3; exit}' /proc/net/route)
            [ -n "$h" ] && gw=$(printf '%d.%d.%d.%d' "0x${h:6:2}" "0x${h:4:2}" "0x${h:2:2}" "0x${h:0:2}")
          fi
          [ -n "$gw" ] || { echo "could not resolve the dind gateway" >&2; exit 1; }
          echo "DOCKER_HOST=tcp://${gw}:2375" >> "$GITHUB_ENV"

      - name: Run Semgrep
        shell: bash
        run: |
          set -euo pipefail
          # The dind daemon cannot bind-mount this workspace: separate containers,
          # separate filesystems. Stream the tree in over stdin rather than
          # reaching for a -v that would mount an empty directory.
          tar -cf - --exclude=.git . \
            | docker run --rm -i semgrep/semgrep:1.144.0@sha256:10301f060aacf84078f9704fb1ba3a321df4ac46b009fd29c1c66880d1db8e77 \
                sh -ec 'mkdir -p /src && tar -xf - -C /src && \
                  semgrep scan \
                    --config p/golang \
                    --config p/security-audit \
                    --error --metrics=off --quiet /src'
