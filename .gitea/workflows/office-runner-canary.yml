name: Office runner canary

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tool-checkout-build:
    name: Tool, checkout, test, and build proof
    runs-on: cauda-k8s-office-canary
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prove the baked toolchain
        run: |
          set -eux
          git --version
          node --version
          npm --version
          go version
          docker --version
          kubectl version --client
          helm version --short
      - name: Test and build a real module
        working-directory: mediaserver/navidrome
        run: |
          set -eux
          go test ./...
          go build ./...

