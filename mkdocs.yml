site_name: goenvoy
site_description: Pure-stdlib Go client libraries for media automation, metadata, and download service APIs.
site_url: https://golusoris.github.io/goenvoy/
repo_url: https://github.com/golusoris/goenvoy
repo_name: golusoris/goenvoy
docs_dir: docs
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.details

nav:
  - Home: index.md
  - Principles: principles.md
  - Triage runbook: triage-runbook.md
  - Architecture Decisions:
      - Overview: adr/README.md
      - "ADR-0001 — Pure stdlib, no external dependencies": adr/0001-pure-stdlib.md
      - "ADR-0002 — Per-module independent semver": adr/0002-per-module-semver.md
      - "ADR-0003 — New(baseURL, apiKey string, opts ...Option) (*Client, error)": adr/0003-new-constructor-shape.md
      - "ADR-0004 — Functional-options configuration": adr/0004-functional-options.md
      - "ADR-0005 — Per-module APIError struct": adr/0005-api-error-type.md
      - "ADR-0006 — httptest-only tests — no live API calls": adr/0006-httptest-only-tests.md
      - "ADR-0007 — OAuth2 flow helpers — device / auth-code / PKCE / refresh": adr/0007-oauth2-flows.md
      - "ADR-0008 — JSON-RPC / XML-RPC / GraphQL clients use the same patterns": adr/0008-non-rest-wire-protocols.md
      - "ADR-0009 — Drop committed replace ../ directives in favour of go.work": adr/0009-local-replace-directives.md
      - Template: adr/0000-template.md
  - Upstream API notes:
      - anime:
          - Shoko Server: upstream/anime-shoko.md
      - arr:
